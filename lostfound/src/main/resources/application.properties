# ===============================
# DATABASE CONNECTION
# Credentials come from environment variables (or an untracked lostfound/.env file). Nothing secret lives in git.
#   DB_URL       default: jdbc:mysql://localhost:3306/lostfound_db
#   DB_USERNAME  default: root
#   DB_PASSWORD  REQUIRED, no default
# ===============================
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lostfound_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# APP CONFIG
# ===============================
server.port=8080
spring.application.name=lostfound

# ===============================
# BROWSER ACCESS (CORS) AND SESSION COOKIE
# CORS_ALLOWED_ORIGINS: comma-separated list of exact frontend origins (never '*').
# In production behind HTTPS set SESSION_COOKIE_SECURE=true.
# If the frontend and API are on different sites, also set SESSION_COOKIE_SAME_SITE=none (requires Secure).
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
